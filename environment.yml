# conda env create -f environment.yml && conda activate mfgpr-framework && pip install -e .
# Pinned to the versions the tests were run with (Python 3.12).
name: mfgpr-framework
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==2.5.4
      - scipy==1.18.1
      - pandas==3.1.0
      - pytest==9.2.0
