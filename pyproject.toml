[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mfgpr-framework"
version = "1.0.1"
description = "Multi-fidelity Gaussian process regression for probabilistic wind power curves (framework of Li, Feng & Zhang, ASME IDETC 2023)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Honglin Li"}]
requires-python = ">=3.10"
# Lower bounds = oldest versions the test suite was run with (and passed); newest tested: see environment.yml
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1"]
keywords = ["wind energy", "power curve", "Gaussian process", "multi-fidelity", "uncertainty quantification"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
mfgpr-framework = "mfgpr_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
